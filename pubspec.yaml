name: peluna
description: "Local score-based diary app"
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  table_calendar: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 
  hive_ce_generator: 
  flutter_launcher_icons: ^0.14.4
  rename_app: ^1.6.6

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

config_name:
  name: "Peluna"